<title>Razão — Finanças do casal</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    --ink:#1C2531; --slate:#3A506B; --slate-soft:#6C7C93;
    --paper:#F6F3EC; --paper-raised:#FFFFFF; --line:#E1DACB;
    --gold:#B9852E; --gold-soft:#F1E3C5;
    --green:#3E7A5C; --green-soft:#DDEFE3;
    --red:#A6443A; --red-soft:#F3E2DF;
    --blue:#3568A6; --blue-soft:#DCE7F5;
    --plum:#8A4A78; --plum-soft:#F1DFEB;
    --teal:#2B8079; --teal-soft:#DAEFEC;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
  .app{max-width:1080px;margin:0 auto;padding:24px 16px 60px;}

  .masthead{display:flex;align-items:baseline;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:14px;margin-bottom:20px;flex-wrap:wrap;gap:10px;}
  .masthead h1{font-family:'Fraunces',serif;font-weight:600;font-size:28px;margin:0;letter-spacing:-0.01em;background:linear-gradient(90deg,var(--ink),var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent;}
  .masthead .sub{font-size:11px;color:var(--slate-soft);letter-spacing:.08em;text-transform:uppercase;margin-top:3px;}
  .masthead-right{text-align:right;font-size:12px;color:var(--slate-soft);}

  .controls{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:20px;}
  .userswitch{display:flex;background:var(--paper-raised);border:1px solid var(--line);border-radius:999px;padding:3px;}
  .userswitch button{border:none;background:transparent;padding:8px 16px;border-radius:999px;font-weight:600;font-size:13px;cursor:pointer;color:var(--slate);display:flex;align-items:center;gap:6px;}
  .userswitch button.active.u-levherson{background:var(--blue);color:#fff;}
  .userswitch button.active.u-esposa{background:var(--plum);color:#fff;}
  .dot{width:8px;height:8px;border-radius:50%;}

  .monthnav{display:flex;align-items:center;gap:12px;font-family:'Fraunces',serif;}
  .monthnav button{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--paper-raised);cursor:pointer;font-size:15px;color:var(--ink);}
  .monthnav button:hover{background:var(--gold-soft);}
  .monthnav .label{font-size:16px;font-weight:600;min-width:140px;text-align:center;text-transform:capitalize;}

  .tabs{display:flex;gap:6px;}
  .tabs button{border:1px solid var(--line);background:var(--paper-raised);padding:8px 14px;border-radius:8px;font-weight:600;font-size:13px;cursor:pointer;color:var(--slate);}
  .tabs button.active{background:var(--gold);border-color:var(--gold);color:#fff;}
  .subtabs{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0;}
  .subtabs button{border:1px solid var(--line);background:var(--paper-raised);padding:7px 13px;border-radius:8px;font-weight:600;font-size:12.5px;cursor:pointer;color:var(--slate);}
  .subtabs button.active{background:var(--ink);border-color:var(--ink);color:#fff;}

  .ribbon{background:linear-gradient(135deg,var(--ink) 60%,#233A54);color:#fff;border-radius:var(--radius);padding:20px 24px;display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:16px;}
  .ribbon .balance-label{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:#B9C2D4;margin-bottom:4px;}
  .ribbon .balance-value{font-family:'Fraunces',serif;font-size:34px;font-weight:600;}
  .ribbon .balance-brl{font-family:'JetBrains Mono',monospace;font-size:13px;color:#CBD6E8;margin-top:2px;}
  .ribbon .balance-value.neg{color:#F0A79B;}
  .ribbon .balance-value.pos{color:#9EE8BC;}
  .ribbon .balance-brl-inline{font-family:'JetBrains Mono',monospace;font-size:16px;font-weight:400;color:#CBD6E8;margin-left:10px;}
  .ribbon .balance-value-brl{font-family:'Fraunces',serif;font-size:21px;font-weight:600;margin-top:12px;color:#fff;}
  .ribbon .balance-value-brl.pos{color:#9EE8BC;} .ribbon .balance-value-brl.neg{color:#F0A79B;}
  .ribbon .balance-value-brl .lbl{font-family:'Inter',sans-serif;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#B9C2D4;display:block;margin-bottom:2px;font-weight:600;}
  .ribbon-side{display:flex;flex-direction:column;align-items:flex-end;gap:12px;}
  .ribbon-stat{text-align:right;}
  .ribbon-stat span{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:#B9C2D4;margin-bottom:2px;}
  .ribbon-stat strong{font-family:'JetBrains Mono',monospace;font-size:15px;color:#fff;}
  .sparkline{display:flex;align-items:flex-end;gap:6px;height:44px;}
  .spark-bar{width:13px;border-radius:3px 3px 0 0;background:#4A5E7D;}
  .spark-bar.pos{background:#5FC48D;} .spark-bar.neg{background:#DB7C6E;}
  .spark-labels{display:flex;gap:6px;margin-top:4px;}
  .spark-labels span{width:13px;font-size:9px;color:#8C9AB3;text-align:center;}
  .spark-wrap{text-align:center;}

  .goalbar{background:var(--paper-raised);border:1px solid var(--line);border-left:4px solid var(--teal);border-radius:var(--radius);padding:14px 18px;margin-bottom:18px;}
  .goalbar-top{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--slate);margin-bottom:8px;}
  .goalbar-top input{width:90px;text-align:right;font-family:'JetBrains Mono',monospace;border:1px solid var(--line);border-radius:6px;padding:4px 7px;font-size:12.5px;}
  .goalbar-track{height:8px;background:var(--line);border-radius:4px;overflow:hidden;}
  .goalbar-fill{height:100%;background:var(--teal);}
  .goalbar-fill.short{background:var(--gold);}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media(max-width:760px){.grid{grid-template-columns:1fr;} .joint-cols{grid-template-columns:1fr !important;}}
  .card{background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius);padding:18px;border-left:4px solid var(--line);}
  .card.acc-income{border-left-color:var(--green);}
  .card.acc-expense{border-left-color:var(--red);}
  .card.acc-card{border-left-color:var(--plum);}
  .card.acc-chart{border-left-color:var(--gold);}
  .card.acc-fx{border-left-color:var(--blue);}
  .card.acc-proj{border-left-color:var(--teal);}
  .card h2{font-family:'Fraunces',serif;font-size:16px;margin:0 0 12px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;}
  .card h2 .tag{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:400;color:var(--slate-soft);}

  .row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);gap:8px;}
  .row:last-of-type{border-bottom:none;}
  .row label{font-size:13.5px;color:var(--slate);flex:1;}
  .row .field-wrap{display:flex;flex-direction:column;align-items:flex-end;gap:2px;}
  .currency-select{border:1px solid var(--line);border-radius:6px;padding:6px 4px;font-size:12px;background:#FCFBF8;color:var(--slate);margin-left:4px;cursor:pointer;}
  .row input[type=number]{width:100px;text-align:right;font-family:'JetBrains Mono',monospace;font-size:13.5px;border:1px solid var(--line);border-radius:6px;padding:6px 7px;background:#FCFBF8;color:var(--ink);}
  .row input[type=text]{flex:1;font-size:13px;border:1px solid var(--line);border-radius:6px;padding:6px 7px;background:#FCFBF8;}
  .row.total{font-weight:700;padding-top:11px;}
  .row.total .val{font-family:'JetBrains Mono',monospace;}
  .euro{font-size:11.5px;color:var(--slate-soft);margin-left:3px;}
  .brl-sub{font-size:10.5px;color:var(--slate-soft);font-family:'JetBrains Mono',monospace;}
  .star-btn{border:none;background:none;cursor:pointer;font-size:14px;color:var(--line);}
  .star-btn.is-override{color:var(--gold);}
  .override-tag{font-size:9px;color:var(--gold);text-transform:uppercase;letter-spacing:.04em;}

  .small-btn{border:1px solid var(--line);background:#FCFBF8;border-radius:6px;padding:5px 9px;font-size:12px;cursor:pointer;color:var(--slate);}
  .small-btn:hover{background:var(--gold-soft);border-color:var(--gold);}
  .del-btn{border:none;background:none;color:var(--red);cursor:pointer;font-size:14px;padding:0 4px;}
  .add-line{display:flex;gap:8px;margin-top:8px;}

  .card-item{background:#FCFBF8;border:1px solid var(--line);border-radius:8px;padding:11px;margin-bottom:9px;}
  .card-item-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:8px;}
  .card-item-top strong{font-size:13px;}
  .card-item-meta{font-size:11px;color:var(--slate-soft);font-family:'JetBrains Mono',monospace;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .badge-soon{background:var(--gold-soft);color:#8A611F;font-family:'Inter';font-weight:600;font-size:10px;padding:2px 7px;border-radius:999px;}
  .badge-currency{background:var(--blue-soft);color:var(--blue);font-family:'Inter';font-weight:600;font-size:10px;padding:2px 7px;border-radius:999px;}
  .progress{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:6px;}
  .progress-fill{height:100%;background:var(--plum);}
  .new-card-form{display:grid;grid-template-columns:1.2fr 0.8fr 0.65fr 0.7fr 1fr auto;gap:7px;margin-top:10px;}
  .new-card-form input, .new-card-form select{border:1px solid var(--line);border-radius:6px;padding:7px;font-size:12px;font-family:'Inter';}
  .new-card-form input[type=number]{font-family:'JetBrains Mono',monospace;}
  @media(max-width:560px){.new-card-form{grid-template-columns:1fr 1fr;}}

  .proj-table{width:100%;border-collapse:collapse;font-family:'JetBrains Mono',monospace;font-size:12px;}
  .proj-table th{text-align:right;font-family:'Inter';font-weight:600;color:var(--slate-soft);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;padding-bottom:7px;}
  .proj-table th:first-child,.proj-table td:first-child{text-align:left;}
  .proj-table td{text-align:right;padding:6px 0;border-top:1px solid var(--line);}
  .proj-table td.pos{color:var(--green);} .proj-table td.neg{color:var(--red);}
  .proj-table td.muted{color:var(--slate-soft);}

  .joint-cols{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
  .joint-cols .card h2{font-size:14px;}
  .mini-total{font-family:'JetBrains Mono',monospace;font-size:13px;}

  .chart-toggle{display:flex;gap:4px;}
  .chart-toggle button{border:1px solid var(--line);background:#FCFBF8;padding:4px 10px;font-size:11px;border-radius:6px;cursor:pointer;color:var(--slate);}
  .chart-toggle button.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  .legend{display:flex;flex-direction:column;gap:6px;margin-top:12px;}
  .legend-item{display:flex;align-items:center;gap:8px;font-size:12px;}
  .legend-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0;}
  .legend-item .val{margin-left:auto;font-family:'JetBrains Mono',monospace;color:var(--slate-soft);}

  .fx-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:12.5px;}
  .fx-row:last-child{border-bottom:none;}
  .fx-delta{font-family:'JetBrains Mono',monospace;font-size:11px;padding:1px 6px;border-radius:5px;}
  .fx-delta.up{background:var(--red-soft);color:var(--red);}
  .fx-delta.down{background:var(--green-soft);color:var(--green);}
  .fx-manual{display:flex;gap:6px;align-items:center;margin-top:10px;}
  .fx-manual input{width:80px;font-family:'JetBrains Mono',monospace;border:1px solid var(--line);border-radius:6px;padding:5px 7px;font-size:12px;}

  .empty-note{font-size:12px;color:var(--slate-soft);font-style:italic;padding:6px 0;}
  .footnote{margin-top:24px;font-size:11.5px;color:var(--slate-soft);text-align:center;line-height:1.5;}
  .loading{text-align:center;padding:60px;color:var(--slate-soft);font-family:'Fraunces',serif;font-size:16px;}

  .setup-screen{max-width:640px;margin:60px auto;background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius);padding:32px;}
  .setup-screen h2{font-family:'Fraunces',serif;font-size:22px;margin-top:0;}
  .setup-screen ol{padding-left:20px;line-height:1.8;font-size:14px;color:var(--slate);}
  .setup-screen code{background:var(--gold-soft);padding:2px 6px;border-radius:4px;font-family:'JetBrains Mono',monospace;font-size:12.5px;}
</style>
</head>
<body>
<div id="root" class="app"><div class="loading">Abrindo o razão…</div></div>

<script>
// ============================================================
// COLE AQUI a configuração do seu projeto Firebase (veja o passo
// a passo que o Claude te enviou). Substitua os valores abaixo
// pelos que aparecem no console do Firebase.
// ============================================================
const firebaseConfig = {
  apiKey: "AIzaSyBjmLhn11gOJH6UU-eWzkImiG8oNwrzXgU",
  authDomain: "razao-financas.firebaseapp.com",
  projectId: "razao-financas",
  storageBucket: "razao-financas.firebasestorage.app",
  messagingSenderId: "352042765495",
  appId: "1:352042765495:web:ed03e5912e4bc18cd0d132"
};

let db = null, docRef = null, firebaseReady = false;
function initFirebase(){
  if(!firebaseConfig.apiKey || firebaseConfig.apiKey.includes('COLE_AQUI')){ firebaseReady = false; return; }
  try{
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    docRef = db.collection('razao').doc('dados');
    firebaseReady = true;
  }catch(e){ console.error('Erro ao iniciar o Firebase', e); firebaseReady = false; }
}

const MONTHS = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
const USERS = { levherson: "Levherson", esposa: "Thalita" };
const FIXED_KEYS = [
  {key:"aluguel", label:"Aluguel", color:"#B9852E"},
  {key:"agua", label:"Água", color:"#3568A6"},
  {key:"luz", label:"Luz / Energia", color:"#C98A4A"},
];
const CARD_COLOR = "#8A4A78";
const GROCERY_COLOR = "#3E7A5C";
const CUSTOM_PALETTE = ["#6C7C93","#C98A4A","#2B8079","#A6443A","#3568A6","#8A4A78","#B9852E"];

let state = {
  currentUser: "levherson",
  tab: "individual",
  subTab: "resumo",
  ym: monthKey(new Date()),
  chartType: "pizza",
  profiles: {}, overrides: {}, extraIncome: {}, customExpenses: {}, cards: {}, fxRates: {}, remittances: {}, groceries: {},
  _fxLoading: {}, _fxFailed: {}, dailyFx: {}, _dailyLoading: {}, _dailyFetchedMonths: {}
};

function monthKey(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); }
function addMonths(ym, n){ const [y,m] = ym.split("-").map(Number); const d = new Date(y, m-1+n, 1); return monthKey(d); }
function fmtMonthLabel(ym){ const [y,m] = ym.split("-").map(Number); return MONTHS[m-1] + " de " + y; }
function euro(v){ const n = Number(v)||0; return n.toLocaleString('pt-BR',{minimumFractionDigits:2, maximumFractionDigits:2}); }
function real(v){ const n = Number(v)||0; return n.toLocaleString('pt-BR',{minimumFractionDigits:2, maximumFractionDigits:2}); }
function uid(){ return Math.random().toString(36).slice(2,9); }

const DEFAULT_PROFILE = { salary: 0, aluguel: 0, agua: 0, luz: 0, savingsGoal: 0,
  salaryCurrency: 'EUR', aluguelCurrency: 'EUR', aguaCurrency: 'EUR', luzCurrency: 'EUR' };
const OVERRIDABLE_FIELDS = ["salary","aluguel","agua","luz"];


function ensureDefaults(){
  if(!state.profiles.levherson) state.profiles.levherson = {...DEFAULT_PROFILE};
  if(!state.profiles.esposa) state.profiles.esposa = {...DEFAULT_PROFILE};
  state.profiles.levherson = {...DEFAULT_PROFILE, ...state.profiles.levherson};
  state.profiles.esposa = {...DEFAULT_PROFILE, ...state.profiles.esposa};
  if(!state.cards.levherson) state.cards.levherson = [];
  if(!state.cards.esposa) state.cards.esposa = [];
}
const SYNCED_KEYS = ['profiles','overrides','extraIncome','customExpenses','cards','fxRates','remittances','groceries'];
async function loadAll(){
  initFirebase();
  if(!firebaseReady){ ensureDefaults(); return; }
  try{
    const snap = await docRef.get();
    const data = snap.exists ? snap.data() : {};
    SYNCED_KEYS.forEach(k=>{ state[k] = data[k] || {}; });
    ensureDefaults();
    // Sincronização em tempo real: sempre que Levherson ou Thalita mudar algo, o outro vê na hora.
    docRef.onSnapshot(s=>{
      if(!s.exists) return;
      const d = s.data();
      SYNCED_KEYS.forEach(k=>{ if(d[k]!==undefined) state[k] = d[k]; });
      ensureDefaults();
      render();
    });
  }catch(e){ console.error('Erro ao carregar do Firebase', e); ensureDefaults(); }
}
async function save(key){
  if(!firebaseReady) return;
  try{ await docRef.set({[key]: state[key]}, {merge:true}); }
  catch(e){ console.error("Falha ao salvar", key, e); }
}

function monthData(user, ym){ const ov = state.overrides[user+":"+ym]; const base = state.profiles[user] || DEFAULT_PROFILE; return { ...base, ...(ov||{}) }; }
function isOverridden(user, ym, field){ const ov = state.overrides[user+":"+ym]; return !!(ov && ov[field] !== undefined); }
function bestRate(ym){
  if(state.fxRates[ym]) return {rate: state.fxRates[ym], estimated:false};
  for(let i=1;i<=12;i++){ const m = addMonths(ym,-i); if(state.fxRates[m]) return {rate: state.fxRates[m], estimated:true}; }
  return {rate:null, estimated:false};
}
function cardValueInEur(c, ym){
  if(c.currency !== 'BRL') return Number(c.value);
  const {rate} = bestRate(ym);
  if(!rate) return 0;
  return Number(c.value)/rate;
}
function amountInEur(value, currency, ym){
  if(currency === 'BRL'){
    const {rate} = bestRate(ym);
    if(!rate) return 0;
    return Number(value)/rate;
  }
  return Number(value)||0;
}
function cardTotalForMonth(user, ym){
  const list = state.cards[user] || []; let total = 0; const active = [];
  for(const c of list){ const idx = monthsBetween(c.start, ym); if(idx >= 0 && idx < c.total){ total += cardValueInEur(c, ym); active.push({...c, idx}); } }
  return {total, active};
}
function cardSplitForMonth(user, ym){
  const list = state.cards[user] || []; let eur=0, brl=0;
  for(const c of list){ const idx = monthsBetween(c.start, ym); if(idx >= 0 && idx < c.total){ if(c.currency==='BRL') brl += Number(c.value); else eur += Number(c.value); } }
  return {eur, brl};
}
function monthsBetween(fromYm, toYm){ const [fy,fm] = fromYm.split("-").map(Number); const [ty,tm] = toYm.split("-").map(Number); return (ty-fy)*12 + (tm-fm); }
function extraIncomeFor(user, ym){ return state.extraIncome[user+":"+ym] || []; }
function customExpensesFor(user, ym){ return state.customExpenses[user+":"+ym] || []; }
function groceriesFor(user, ym){ return state.groceries[user+":"+ym] || []; }
function splitByCurrency(items){
  return items.reduce((acc,i)=>{ const c = (i.currency||'EUR')==='BRL' ? 'BRL' : 'EUR'; acc[c] += Number(i.value)||0; return acc; }, {EUR:0, BRL:0});
}

function totalsFor(user, ym){
  const d = monthData(user, ym);
  const {total: cardTotal, active} = cardTotalForMonth(user, ym);
  const extraItems = extraIncomeFor(user, ym);
  const customItems = customExpensesFor(user, ym);
  const groceryItems = groceriesFor(user, ym);
  const fixedItems = FIXED_KEYS.map(f=>({value:d[f.key], currency:d[f.key+'Currency']||'EUR'}));
  const salaryItem = {value:d.salary, currency:d.salaryCurrency||'EUR'};
  const extra = extraItems.reduce((s,i)=>s+amountInEur(i.value, i.currency||'EUR', ym),0);
  const custom = customItems.reduce((s,i)=>s+amountInEur(i.value, i.currency||'EUR', ym),0);
  const grocery = groceryItems.reduce((s,i)=>s+amountInEur(i.value, i.currency||'EUR', ym),0);
  const salaryEur = amountInEur(d.salary, d.salaryCurrency||'EUR', ym);
  const income = salaryEur + extra;
  const fixedTotal = fixedItems.reduce((s,i)=>s+amountInEur(i.value, i.currency, ym), 0);
  const remit = remittancesFor(user, ym).reduce((s,r)=>s+Number(r.eur),0);
  const remitBrl = remittancesFor(user, ym).reduce((s,r)=>s+Number(r.brl),0);
  const expenses = fixedTotal + cardTotal + custom + grocery;
  const balance = income - expenses - remit;

  // Saldos separados por moeda nativa (sem conversão): cada despesa/renda abate só do lado da moeda em que foi lançada.
  const cardSplit = cardSplitForMonth(user, ym);
  const incomeSplit = splitByCurrency([salaryItem, ...extraItems]);
  const expenseSplit = splitByCurrency([...fixedItems, ...customItems, ...groceryItems]);
  expenseSplit.EUR += cardSplit.eur; expenseSplit.BRL += cardSplit.brl;
  const incomeEur = incomeSplit.EUR, incomeBrl = incomeSplit.BRL;
  const expensesEur = expenseSplit.EUR, expensesBrl = expenseSplit.BRL;
  const balanceEur = incomeEur - expensesEur - remit;
  const balanceBrl = incomeBrl - expensesBrl + remitBrl;

  return { income, expenses, balance, cardTotal, extra, custom, grocery, remit, remitBrl, d, cardActive: active, fixedTotal,
    incomeEur, incomeBrl, expensesEur, expensesBrl, balanceEur, balanceBrl };
}
function categoriesFor(user, ym){
  const t = totalsFor(user, ym);
  const cats = FIXED_KEYS.map(f=>({label:f.label, value:amountInEur(t.d[f.key], t.d[f.key+'Currency']||'EUR', ym), color:f.color}));
  if(t.cardTotal>0) cats.push({label:"Despesas recorrentes", value:t.cardTotal, color:CARD_COLOR});
  if(t.grocery>0) cats.push({label:"Mercado", value:t.grocery, color:GROCERY_COLOR});
  customExpensesFor(user, ym).forEach((item, idx)=>{
    const val = amountInEur(item.value, item.currency||'EUR', ym);
    if(val>0) cats.push({label: (item.name && item.name.trim()) ? item.name.trim() : 'Despesa sem nome', value: val, color: CUSTOM_PALETTE[idx % CUSTOM_PALETTE.length]});
  });
  return cats.filter(c=>c.value>0);
}

// ---------- Câmbio (EUR -> BRL) ----------
function refDateForMonth(ym){
  const todayYm = monthKey(new Date());
  if(ym > todayYm) return null;
  if(ym === todayYm){ return 'latest'; }
  const [y,m] = ym.split('-').map(Number);
  const last = new Date(y, m, 0);
  return last.toISOString().slice(0,10);
}
async function ensureFxRate(ym){
  if(state.fxRates[ym] !== undefined) return;
  if(state._fxLoading[ym]) return;
  const date = refDateForMonth(ym);
  if(!date){ return; }
  state._fxLoading[ym] = true;
  const urls = [
    `https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@${date}/v1/currencies/eur.json`,
    `https://${date}.currency-api.pages.dev/v1/currencies/eur.json`
  ];
  let success = false;
  for(const url of urls){
    try{
      const resp = await fetch(url);
      if(!resp.ok) continue;
      const data = await resp.json();
      const rate = data && data.eur && data.eur.brl;
      if(rate){ state.fxRates[ym] = rate; state._fxFailed[ym] = false; await save('fxRates'); render(); success = true; break; }
    }catch(e){ console.error('Falha ao buscar câmbio automático (tentativa)', url, e); }
  }
  if(!success){ state._fxFailed[ym] = true; render(); }
  state._fxLoading[ym] = false;
}
function ensureFxRange(){
  for(let i=-2;i<=5;i++){ ensureFxRate(addMonths(state.ym,i)); }
}

function pieSvg(cats){
  const total = cats.reduce((s,c)=>s+c.value,0) || 1;
  let angle = -90, paths = '';
  const cx=90, cy=90, r=80;
  cats.forEach(c=>{
    const slice = (c.value/total)*360;
    const x1 = cx + r*Math.cos(angle*Math.PI/180), y1 = cy + r*Math.sin(angle*Math.PI/180);
    const end = angle+slice;
    const x2 = cx + r*Math.cos(end*Math.PI/180), y2 = cy + r*Math.sin(end*Math.PI/180);
    const large = slice>180?1:0;
    paths += `<path d="M${cx},${cy} L${x1.toFixed(2)},${y1.toFixed(2)} A${r},${r} 0 ${large} 1 ${x2.toFixed(2)},${y2.toFixed(2)} Z" fill="${c.color}" stroke="#fff" stroke-width="2"/>`;
    angle = end;
  });
  return `<svg viewBox="0 0 180 180" width="180" height="180">${paths}<circle cx="${cx}" cy="${cy}" r="34" fill="var(--paper-raised)"/></svg>`;
}
function barSvg(cats){
  const max = Math.max(...cats.map(c=>c.value), 1);
  const barH = 22, gap = 10, w = 260;
  const h = cats.length*(barH+gap);
  let bars = '';
  cats.forEach((c,i)=>{ const bw = (c.value/max)*(w-10); const y = i*(barH+gap); bars += `<rect x="0" y="${y}" width="${bw.toFixed(1)}" height="${barH}" rx="4" fill="${c.color}"/>`; });
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}">${bars}</svg>`;
}

// ---------- Câmbio diário (melhor dia para enviar) ----------
async function ensureDailyRate(dateStr){
  if(state.dailyFx[dateStr] !== undefined) return;
  if(state._dailyLoading[dateStr]) return;
  state._dailyLoading[dateStr] = true;
  const urls = [
    `https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@${dateStr}/v1/currencies/eur.json`,
    `https://${dateStr}.currency-api.pages.dev/v1/currencies/eur.json`
  ];
  let success = false;
  for(const url of urls){
    try{
      const resp = await fetch(url);
      if(!resp.ok) continue;
      const data = await resp.json();
      const rate = data && data.eur && data.eur.brl;
      if(rate){ state.dailyFx[dateStr] = rate; success = true; break; }
    }catch(e){ /* tenta a próxima fonte */ }
  }
  if(!success) state.dailyFx[dateStr] = null;
  state._dailyLoading[dateStr] = false;
}
function ensureDailyRatesForMonth(ym){
  if(state._dailyFetchedMonths[ym]) return;
  state._dailyFetchedMonths[ym] = true;
  const todayStr = new Date().toISOString().slice(0,10);
  const [y,m] = ym.split('-').map(Number);
  const daysInMonth = new Date(y,m,0).getDate();
  const jobs = [];
  for(let day=1; day<=daysInMonth; day++){
    const dateStr = `${ym}-${String(day).padStart(2,'0')}`;
    if(dateStr > todayStr) break;
    jobs.push(ensureDailyRate(dateStr));
  }
  Promise.all(jobs).then(()=>render());
}
function bestDayCard(){
  const ym = state.ym;
  const [y,m] = ym.split('-').map(Number);
  const daysInMonth = new Date(y,m,0).getDate();
  const todayStr = new Date().toISOString().slice(0,10);
  const entries = [];
  for(let day=1; day<=daysInMonth; day++){
    const dateStr = `${ym}-${String(day).padStart(2,'0')}`;
    if(dateStr > todayStr) break;
    const r = state.dailyFx[dateStr];
    if(r !== undefined && r !== null) entries.push({day, rate:r});
  }
  if(entries.length === 0){
    return `<div class="card acc-fx"><h2>Melhor dia para enviar (mês atual)</h2>
      <div class="empty-note">Buscando cotações diárias deste mês…</div></div>`;
  }
  const best = entries.reduce((a,b)=>b.rate>a.rate?b:a);
  const worst = entries.reduce((a,b)=>b.rate<a.rate?b:a);
  const max = Math.max(...entries.map(e=>e.rate)), min = Math.min(...entries.map(e=>e.rate));
  return `<div class="card acc-fx">
    <h2>Melhor dia para enviar (mês atual)</h2>
    <div class="empty-note">Quanto maior a cotação, mais reais você recebe por euro enviado.</div>
    <div style="display:flex;align-items:flex-end;gap:3px;height:60px;margin:12px 0;overflow-x:auto;">
      ${entries.map(e=>{
        const h = Math.max(4, Math.round(((e.rate-min)/((max-min)||1))*50)+6);
        const isBest = e.day===best.day;
        return `<div title="Dia ${e.day}: R$ ${real(e.rate)}" style="width:9px;flex:0 0 auto;border-radius:2px 2px 0 0;height:${h}px;background:${isBest?'var(--teal)':'var(--line)'}"></div>`;
      }).join('')}
    </div>
    <div class="row"><label>Melhor dia até agora</label><div class="mini-total">Dia ${best.day} — R$ ${real(best.rate)}</div></div>
    <div class="row"><label>Pior dia até agora</label><div class="mini-total">Dia ${worst.day} — R$ ${real(worst.rate)}</div></div>
  </div>`;
}

function exportCsv(user){
  const rows = [["Mês","Renda (EUR)","Despesas (EUR)","Saldo (EUR)","Câmbio (R$/€)","Saldo (R$)"]];
  for(let i=0;i<6;i++){
    const m = addMonths(state.ym,i); const t = totalsFor(user,m); const rate = state.fxRates[m];
    rows.push([fmtMonthLabel(m), t.income.toFixed(2), t.expenses.toFixed(2), t.balance.toFixed(2), rate?rate.toFixed(4):'', rate?(t.balance*rate).toFixed(2):'']);
  }
  const csv = rows.map(r=>r.join(';')).join('\n');
  const blob = new Blob(["\uFEFF"+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = `financas-${USERS[user]}-${state.ym}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
}

function individualView(){
  const u = state.currentUser;
  const t = totalsFor(u, state.ym);
  const brl = brlOf(t.balanceEur, state.ym);
  const sub = state.subTab || 'resumo';
  const tabs = [
    ['resumo','Renda & Despesas'],
    ['grafico','Gráfico'],
    ['cartao','Despesas recorrentes'],
    ['cambio','Câmbio & Remessas'],
    ['projecao','Projeção']
  ];
  return `
  <div class="ribbon">
    <div>
      <div class="balance-label">Saldo do mês — ${USERS[u]}</div>
      <div class="balance-value ${t.balanceEur>=0?'pos':'neg'}">€ ${euro(t.balanceEur)}${brl!==null?`<span class="balance-brl-inline">≈ R$ ${real(brl)}</span>`:''}</div>
      ${brl===null ? fxLine(state.ym) : ''}
      ${t.remit>0 ? `<div class="balance-brl" style="margin-top:3px;">já descontado: € ${euro(t.remit)} enviados ao Brasil</div>` : ''}
      <div class="balance-value-brl ${t.balanceBrl>=0?'pos':'neg'}"><span class="lbl">Saldo em reais (só contas em R$)</span>R$ ${real(t.balanceBrl)}</div>
    </div>
    <div class="ribbon-side">
      <div class="ribbon-stat"><span>Total gasto em €</span><strong>€ ${euro(t.expensesEur)}</strong></div>
      ${sparkline(u)}
    </div>
  </div>
  ${goalBar(u)}
  <div class="subtabs">
    ${tabs.map(([key,label])=>`<button data-subtab="${key}" class="${sub===key?'active':''}">${label}</button>`).join('')}
  </div>
  ${sub==='resumo' ? sectionResumo(u, t) : ''}
  ${sub==='grafico' ? sectionGrafico(u) : ''}
  ${sub==='cartao' ? sectionCartao(u, t) : ''}
  ${sub==='cambio' ? sectionCambio(u) : ''}
  ${sub==='projecao' ? sectionProjecao(u) : ''}
  `;
}

function sectionResumo(u, t){
  return `
  <div class="grid">
    <div class="card acc-income">
      <h2>Renda <span class="tag">€ ${euro(t.income)}</span></h2>
      ${fieldRow(u, state.ym, 'salary', 'Salário mensal', true)}
      ${extraIncomeFor(u,state.ym).map(item=>{
        const currency = item.currency || 'EUR';
        const rate = bestRate(state.ym).rate;
        const note = currency==='BRL'
          ? (rate?`<span class="brl-sub">≈ € ${euro(amountInEur(item.value,'BRL',state.ym))}</span>`:`<span class="brl-sub">câmbio indisponível</span>`)
          : (rate?`<span class="brl-sub">≈ R$ ${real(item.value*rate)}</span>`:'');
        return `<div class="row"><input type="text" data-extra-name="${item.id}" value="${item.name}" placeholder="Descrição">
        <div class="field-wrap"><div><input type="number" step="0.01" data-extra-value="${item.id}" value="${item.value}">
          <select class="currency-select" data-extra-currency="${item.id}">
            <option value="EUR" ${currency==='EUR'?'selected':''}>€</option>
            <option value="BRL" ${currency==='BRL'?'selected':''}>R$</option>
          </select></div>${note}</div>
        <button class="del-btn" data-del-extra="${item.id}">✕</button></div>`;
      }).join('')}
      <div class="add-line"><button class="small-btn" data-add="extra">+ Adicionar renda extra</button></div>
      <div class="row total"><label>Total do mês</label><div class="val">€ ${euro(t.income)} ${brlOf(t.income,state.ym)!==null?`<span class="brl-sub">≈ R$ ${real(brlOf(t.income,state.ym))}</span>`:''}</div></div>
    </div>
    <div class="card acc-expense">
      <h2>Despesas fixas <span class="tag">€ ${euro(t.expenses-t.cardTotal-t.custom-t.grocery)}</span></h2>
      ${FIXED_KEYS.map(f=>fieldRow(u, state.ym, f.key, f.label, true)).join('')}
      ${customExpensesFor(u,state.ym).map(item=>{
        const currency = item.currency || 'EUR';
        const rate = bestRate(state.ym).rate;
        const note = currency==='BRL'
          ? (rate?`<span class="brl-sub">≈ € ${euro(amountInEur(item.value,'BRL',state.ym))}</span>`:`<span class="brl-sub">câmbio indisponível</span>`)
          : (rate?`<span class="brl-sub">≈ R$ ${real(item.value*rate)}</span>`:'');
        return `<div class="row"><input type="text" data-custom-name="${item.id}" value="${item.name}" placeholder="Descrição (aparece no gráfico)">
        <div class="field-wrap"><div><input type="number" step="0.01" data-custom-value="${item.id}" value="${item.value}">
          <select class="currency-select" data-custom-currency="${item.id}">
            <option value="EUR" ${currency==='EUR'?'selected':''}>€</option>
            <option value="BRL" ${currency==='BRL'?'selected':''}>R$</option>
          </select></div>${note}</div>
        <button class="del-btn" data-del-custom="${item.id}">✕</button></div>`;
      }).join('')}
      <div class="add-line"><button class="small-btn" data-add="custom">+ Adicionar outra despesa</button></div>
      <div class="empty-note">Cada despesa que você nomear aqui aparece separada, com o próprio nome, no gráfico. Clique na estrela ★ para tornar um valor o padrão dos próximos meses.</div>
    </div>
  </div>
  <div class="grid" style="margin-top:16px;">
    ${groceryCard(u, state.ym)}
  </div>`;
}

function sectionGrafico(u){
  return `<div class="grid">${chartCard(u, state.ym)}</div>`;
}

function sectionCartao(u, t){
  return `
  <div class="grid">
    <div class="card acc-card">
      <h2>Despesas recorrentes <span class="tag">€ ${euro(t.cardTotal)}</span></h2>
      ${(state.cards[u]||[]).length===0 ? `<div class="empty-note">Nenhuma compra parcelada cadastrada.</div>` : ''}
      ${(state.cards[u]||[]).map(c=>{
        const idx = monthsBetween(c.start, state.ym);
        const isActive = idx>=0 && idx<c.total, isPast = idx>=c.total, isFuture = idx<0;
        const endingSoon = isActive && (c.total-idx)<=2;
        const eurVal = cardValueInEur(c, state.ym);
        return `<div class="card-item" style="opacity:${isPast?0.45:1}">
          <div class="card-item-top"><strong>${c.name}</strong><button class="del-btn" data-del-card="${c.id}">✕ remover</button></div>
          <div class="card-item-meta">
            ${c.currency==='BRL' ? `R$ ${real(c.value)} <span class="badge-currency">≈ € ${euro(eurVal)}</span>` : `€ ${euro(c.value)}`} / mês &middot;
            ${isFuture ? `começa em ${fmtMonthLabel(c.start)}` : isPast ? `quitado (foi de ${fmtMonthLabel(c.start)} a ${fmtMonthLabel(addMonths(c.start,c.total-1))})` : `parcela ${idx+1} de ${c.total}`}
            ${endingSoon ? `<span class="badge-soon">Termina em ${c.total-idx} ${c.total-idx===1?'mês':'meses'}</span>` : ''}
          </div>
          <div class="progress"><div class="progress-fill" style="width:${Math.min(100,Math.max(0,(idx+1)/c.total*100))}%"></div></div>
        </div>`;
      }).join('')}
      <div class="new-card-form">
        <input type="text" id="nc-name" placeholder="Nome (ex: Celular)">
        <input type="number" step="0.01" id="nc-value" placeholder="Valor / mês">
        <select id="nc-currency"><option value="EUR">€ Euro</option><option value="BRL">R$ Real</option></select>
        <input type="number" id="nc-total" placeholder="Nº parcelas">
        <input type="month" id="nc-start" value="${state.ym}">
        <button class="small-btn" data-add="card">+ Adicionar</button>
      </div>
    </div>
  </div>`;
}

function sectionCambio(u){
  return `<div class="grid">
    ${fxCard()}
    ${remittanceCard(u, state.ym)}
  </div>
  <div class="grid" style="margin-top:16px;">
    ${bestDayCard()}
  </div>`;
}

function sectionProjecao(u){
  return `
  <div class="grid">
    <div class="card acc-proj">
      <h2>Projeção — 6 meses <button class="small-btn" data-add="csv">⬇ Baixar planilha</button></h2>
      <table class="proj-table">
        <thead><tr><th>Mês</th><th>Renda</th><th>Despesas</th><th>Saldo €</th><th>Saldo R$</th></tr></thead>
        <tbody>
        ${[0,1,2,3,4,5].map(i=>{
          const m = addMonths(state.ym,i); const pt = totalsFor(u,m); const rate = state.fxRates[m];
          return `<tr><td>${MONTHS[Number(m.split('-')[1])-1].slice(0,3)}/${m.split('-')[0].slice(2)}</td>
            <td>€ ${euro(pt.income)}</td><td>€ ${euro(pt.expenses)}</td>
            <td class="${pt.balance>=0?'pos':'neg'}">€ ${euro(pt.balance)}</td>
            <td class="muted">${rate?`R$ ${real(pt.balance*rate)}`:'—'}</td></tr>`;
        }).join('')}
        </tbody>
      </table>
    </div>
  </div>`;
}

function jointView(){
  const tl = totalsFor('levherson', state.ym), te = totalsFor('esposa', state.ym);
  const jointIncome = tl.income+te.income, jointExpenses = tl.expenses+te.expenses, jointBalance = jointIncome-jointExpenses;
  const jointBalanceEur = tl.balanceEur+te.balanceEur, jointBalanceBrl = tl.balanceBrl+te.balanceBrl;
  const jointExpensesEur = tl.expensesEur+te.expensesEur;
  const brl = brlOf(jointBalanceEur, state.ym);
  const jointCats = {};
  [...categoriesFor('levherson',state.ym), ...categoriesFor('esposa',state.ym)].forEach(c=>{
    if(!jointCats[c.label]) jointCats[c.label] = {label:c.label, value:0, color:c.color};
    jointCats[c.label].value += c.value;
  });
  const catsArr = Object.values(jointCats);
  return `
  <div class="ribbon">
    <div>
      <div class="balance-label">Saldo conjunto do mês</div>
      <div class="balance-value ${jointBalanceEur>=0?'pos':'neg'}">€ ${euro(jointBalanceEur)}${brl!==null?`<span class="balance-brl-inline">≈ R$ ${real(brl)}</span>`:''}</div>
      ${brl===null ? fxLine(state.ym) : ''}
      <div class="balance-value-brl ${jointBalanceBrl>=0?'pos':'neg'}"><span class="lbl">Saldo em reais (só contas em R$)</span>R$ ${real(jointBalanceBrl)}</div>
    </div>
    <div class="ribbon-side">
      <div class="ribbon-stat"><span>Total gasto em €</span><strong>€ ${euro(jointExpensesEur)}</strong></div>
      ${sparkline('conjunto')}
    </div>
  </div>
  <div class="joint-cols">
    ${['levherson','esposa'].map(u=>{ const t = totalsFor(u, state.ym); return `
      <div class="card acc-${u==='levherson'?'income':'card'}"><h2>${USERS[u]}</h2>
        <div class="row"><label>Renda</label><div class="mini-total">${bothCur(t.income, state.ym)}</div></div>
        <div class="row"><label>Despesas fixas</label><div class="mini-total">${bothCur(t.expenses-t.cardTotal-t.custom-t.grocery, state.ym)}</div></div>
        <div class="row"><label>Mercado</label><div class="mini-total">${bothCur(t.grocery, state.ym)}</div></div>
        <div class="row"><label>Despesas recorrentes</label><div class="mini-total">${bothCur(t.cardTotal, state.ym)}</div></div>
        <div class="row"><label>Outras despesas</label><div class="mini-total">${bothCur(t.custom, state.ym)}</div></div>
        <div class="row total"><label>Saldo</label><div class="val">${bothCur(t.balance, state.ym)}</div></div>
      </div>`; }).join('')}
    <div class="card acc-proj"><h2>Total do casal</h2>
      <div class="row"><label>Renda somada</label><div class="mini-total">${bothCur(jointIncome, state.ym)}</div></div>
      <div class="row"><label>Despesas somadas</label><div class="mini-total">${bothCur(jointExpenses, state.ym)}</div></div>
      <div class="row total"><label>Saldo conjunto</label><div class="val">${bothCur(jointBalance, state.ym)}</div></div>
    </div>
  </div>
  <div class="grid" style="margin-top:16px;">
    ${catsArr.length ? `<div class="card acc-chart"><h2>Onde foi o dinheiro do casal ${chartToggle()}</h2>
      <div style="display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-top:12px;">
        ${state.chartType==='pizza' ? pieSvg(catsArr) : barSvg(catsArr)}
        <div class="legend" style="flex:1;min-width:160px;">${catsArr.map(c=>`<div class="legend-item"><span class="legend-dot" style="background:${c.color}"></span>${c.label}<span class="val">€ ${euro(c.value)}</span></div>`).join('')}</div>
      </div></div>` : `<div class="card acc-chart"><h2>Onde foi o dinheiro do casal</h2><div class="empty-note">Sem despesas lançadas ainda.</div></div>`}
    ${fxCard()}
  </div>`;
}

function attachEvents(){
  document.querySelectorAll('[data-user]').forEach(b=>{ if(b.tagName==='BUTTON') b.onclick = ()=>{ state.currentUser = b.dataset.user; render(); }; });
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick = ()=>{ state.tab = b.dataset.tab; render(); });
  document.querySelectorAll('[data-subtab]').forEach(b=>b.onclick = ()=>{ state.subTab = b.dataset.subtab; render(); });
  document.querySelectorAll('[data-nav]').forEach(b=>b.onclick = ()=>{ state.ym = addMonths(state.ym, Number(b.dataset.nav)); render(); });
  document.querySelectorAll('[data-chart]').forEach(b=>b.onclick = ()=>{ state.chartType = b.dataset.chart; render(); });

  document.querySelectorAll('input[data-field]').forEach(inp=>{
    inp.onchange = async ()=>{
      const user = inp.dataset.user, field = inp.dataset.field, val = Number(inp.value)||0;
      const key = user+":"+state.ym;
      if(!state.overrides[key]) state.overrides[key] = {};
      state.overrides[key][field] = val;
      await save('overrides'); render();
    };
  });
  document.querySelectorAll('select[data-currency-field]').forEach(sel=>{
    sel.onchange = async ()=>{
      const user = sel.dataset.user, field = sel.dataset.currencyField;
      const key = user+":"+state.ym;
      if(!state.overrides[key]) state.overrides[key] = {};
      state.overrides[key][field+'Currency'] = sel.value;
      await save('overrides'); render();
    };
  });
  document.querySelectorAll('[data-star]').forEach(b=>{
    b.onclick = async ()=>{
      const user = b.dataset.user, field = b.dataset.star, currencyField = field+'Currency';
      const monthD = monthData(user, state.ym);
      state.profiles[user][field] = monthD[field];
      if(monthD[currencyField] !== undefined) state.profiles[user][currencyField] = monthD[currencyField];
      Object.keys(state.overrides).forEach(k=>{ if(k.startsWith(user+":") && k.split(":")[1] >= state.ym && state.overrides[k]){ delete state.overrides[k][field]; delete state.overrides[k][currencyField]; } });
      await save('profiles'); await save('overrides'); render();
    };
  });
  document.querySelectorAll('input[data-goal]').forEach(inp=>{
    inp.onchange = async ()=>{ state.profiles[inp.dataset.goal].savingsGoal = Number(inp.value)||0; await save('profiles'); render(); };
  });

  document.querySelectorAll('[data-add]').forEach(b=>{
    b.onclick = async ()=>{
      const u = state.currentUser, key = u+":"+state.ym;
      if(b.dataset.add==='extra'){ if(!state.extraIncome[key]) state.extraIncome[key]=[]; state.extraIncome[key].push({id:uid(), name:"", value:0, currency:'EUR'}); await save('extraIncome'); }
      else if(b.dataset.add==='custom'){ if(!state.customExpenses[key]) state.customExpenses[key]=[]; state.customExpenses[key].push({id:uid(), name:"", value:0, currency:'EUR'}); await save('customExpenses'); }
      else if(b.dataset.add==='grocery'){ if(!state.groceries[key]) state.groceries[key]=[]; state.groceries[key].push({id:uid(), value:0, currency:'EUR'}); await save('groceries'); }
      else if(b.dataset.add==='remit'){
        const eurVal = Number(document.getElementById('remit-eur').value)||0;
        const brlVal = Number(document.getElementById('remit-brl').value)||0;
        if(eurVal<=0 || brlVal<=0){ alert('Preencha o valor enviado em euros e o valor recebido em reais.'); return; }
        if(!state.remittances[key]) state.remittances[key] = [];
        state.remittances[key].push({id:uid(), eur:eurVal, brl:brlVal});
        await save('remittances');
      }
      else if(b.dataset.add==='card'){
        const name = document.getElementById('nc-name').value.trim();
        const value = Number(document.getElementById('nc-value').value)||0;
        const currency = document.getElementById('nc-currency').value;
        const total = Number(document.getElementById('nc-total').value)||0;
        const start = document.getElementById('nc-start').value || state.ym;
        if(!name || !value || !total){ alert('Preencha nome, valor da parcela e número de parcelas.'); return; }
        if(!state.cards[u]) state.cards[u]=[]; state.cards[u].push({id:uid(), name, value, currency, total, start}); await save('cards');
      } else if(b.dataset.add==='fxmanual'){
        const v = Number(document.getElementById('fx-manual-input').value);
        if(v>0){ state.fxRates[state.ym] = v; await save('fxRates'); }
      } else if(b.dataset.add==='csv'){ exportCsv(u); return; }
      render();
    };
  });

  document.querySelectorAll('[data-extra-name]').forEach(inp=>{ inp.onchange = async ()=>{ const key = state.currentUser+":"+state.ym; state.extraIncome[key].find(i=>i.id===inp.dataset.extraName).name = inp.value; await save('extraIncome'); }; });
  document.querySelectorAll('[data-extra-value]').forEach(inp=>{ inp.onchange = async ()=>{ const key = state.currentUser+":"+state.ym; state.extraIncome[key].find(i=>i.id===inp.dataset.extraValue).value = Number(inp.value)||0; await save('extraIncome'); render(); }; });
  document.querySelectorAll('[data-extra-currency]').forEach(sel=>{ sel.onchange = async ()=>{ const key = state.currentUser+":"+state.ym; state.extraIncome[key].find(i=>i.id===sel.dataset.extraCurrency).currency = sel.value; await save('extraIncome'); render(); }; });
  document.querySelectorAll('[data-del-extra]').forEach(b=>{ b.onclick = async ()=>{ const key = state.currentUser+":"+state.ym; state.extraIncome[key] = state.extraIncome[key].filter(i=>i.id!==b.dataset.delExtra); await save('extraIncome'); render(); }; });
  document.querySelectorAll('[data-del-remit]').forEach(b=>{ b.onclick = async ()=>{ const key = state.currentUser+":"+state.ym; state.remittances[key] = (state.remittances[key]||[]).filter(i=>i.id!==b.dataset.delRemit); await save('remittances'); render(); }; });
  document.querySelectorAll('[data-grocery-value]').forEach(inp=>{ inp.onchange = async ()=>{ const key = state.currentUser+":"+state.ym; state.groceries[key].find(i=>i.id===inp.dataset.groceryValue).value = Number(inp.value)||0; await save('groceries'); render(); }; });
  document.querySelectorAll('[data-grocery-currency]').forEach(sel=>{ sel.onchange = async ()=>{ const key = state.currentUser+":"+state.ym; state.groceries[key].find(i=>i.id===sel.dataset.groceryCurrency).currency = sel.value; await save('groceries'); render(); }; });
  document.querySelectorAll('[data-del-grocery]').forEach(b=>{ b.onclick = async ()=>{ const key = state.currentUser+":"+state.ym; state.groceries[key] = (state.groceries[key]||[]).filter(i=>i.id!==b.dataset.delGrocery); await save('groceries'); render(); }; });

  document.querySelectorAll('[data-custom-name]').forEach(inp=>{ inp.onchange = async ()=>{ const key = state.currentUser+":"+state.ym; state.customExpenses[key].find(i=>i.id===inp.dataset.customName).name = inp.value; await save('customExpenses'); }; });
  document.querySelectorAll('[data-custom-value]').forEach(inp=>{ inp.onchange = async ()=>{ const key = state.currentUser+":"+state.ym; state.customExpenses[key].find(i=>i.id===inp.dataset.customValue).value = Number(inp.value)||0; await save('customExpenses'); render(); }; });
  document.querySelectorAll('[data-custom-currency]').forEach(sel=>{ sel.onchange = async ()=>{ const key = state.currentUser+":"+state.ym; state.customExpenses[key].find(i=>i.id===sel.dataset.customCurrency).currency = sel.value; await save('customExpenses'); render(); }; });
  document.querySelectorAll('[data-del-custom]').forEach(b=>{ b.onclick = async ()=>{ const key = state.currentUser+":"+state.ym; state.customExpenses[key] = state.customExpenses[key].filter(i=>i.id!==b.dataset.delCustom); await save('customExpenses'); render(); }; });

  document.querySelectorAll('[data-del-card]').forEach(b=>{ b.onclick = async ()=>{ const u = state.currentUser; state.cards[u] = state.cards[u].filter(c=>c.id!==b.dataset.delCard); await save('cards'); render(); }; });
}

(async function init(){
  try{ await loadAll(); }catch(e){ console.error(e); }
  render();
})();
</script>
</body>
</html>
